# S34 "merge = deploy" — merge-triggered SOURCE build for sinapsi-indexer.
#
# On a push to main that changes THIS service's source, build + push the
# provenance-tagged source image sinapsi-indexer:sinapsi-0.1.<run> (+ :sinapsi-latest)
# to the Forgejo registry. Path-scoped: ONLY the changed service builds — no
# full-matrix rebuild on every merge (that blast radius is unacceptable).
#
# ADDITIVE. The existing tag-triggered full-matrix build-images.yml (on: tags v*)
# is left completely untouched — a version tag still cuts the whole matrix.
#
# SOURCE plane only: this does NOT emit homelab.release.sinapsi-indexer.published. In the
# two-plane release model, ste/home-server's build-sinapsi-indexer.yml re-publishes this
# source image (retag ste/sinapsi-indexer:0.1.<run> + emit the release event) as the
# release/deploy orchestrator. sinapsi-mcp has no release nkey and must not become
# a second publisher of that subject. See the PR body for the release-emit boundary.
#
# Requires (repo Settings -> Actions): secret REGISTRY_TOKEN, variables REGISTRY +
# REGISTRY_USER. Runs on the self-hosted runner. First build (no source change) is
# available via the workflow_dispatch button / API.
name: build-sinapsi-indexer
on:
  push:
    branches: [main]
    paths:
      - 'src/servers/Sinapsi.Indexer/**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build + push source image
        id: build
        uses: ./.forgejo/actions/build-source-image
        with:
          server: Sinapsi.Indexer
          image: sinapsi-indexer
          registry: ${{ vars.REGISTRY }}
          registry-user: ${{ vars.REGISTRY_USER || 'ste' }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Auto-bump home-server re-publish source ref (opens PR; no merge)
        if: ${{ success() }}
        uses: ./.forgejo/actions/bump-home-server-source-ref
        with:
          image: sinapsi-indexer
          tag: ${{ steps.build.outputs.tag }}
          registry: ${{ vars.REGISTRY || 'forgejo.insalata-fresca.ch' }}
          token: ${{ secrets.HOME_SERVER_PR_TOKEN }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
